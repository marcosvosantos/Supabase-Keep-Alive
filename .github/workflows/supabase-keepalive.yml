name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 12 * * 1,4'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Usa DNS público (mitiga falha de resolução do resolver padrão do runner)
        run: |
          sudo rm -f /etc/resolv.conf
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/resolv.conf

      - name: Valida formato do secret SUPABASE_URL (sem expor o valor)
        run: |
          URL="${{ secrets.SUPABASE_URL }}"
          echo "Comprimento da URL: ${#URL} caracteres"
          case "$URL" in
            https://*) echo "OK: começa com https://" ;;
            "") echo "ERRO: secret SUPABASE_URL está vazio" ;;
            *) echo "ERRO: não começa com https://" ;;
          esac
          case "$URL" in
            *.supabase.co) echo "OK: termina em .supabase.co" ;;
            *supabase.co/) echo "ERRO: tem barra final depois de .supabase.co" ;;
            *) echo "ERRO: não termina em .supabase.co (verifique espaço, quebra de linha ou caractere extra)" ;;
          esac

      - name: Acorda o Supabase
        run: |
          set +e
          RESPOSTA=$(curl -s -o /tmp/resposta.txt -w "%{http_code}" \
            --ipv4 --retry 5 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/keep_alive" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json")
          CURL_EXIT=$?
          set -e

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "Falha de conexão com o Supabase (curl exit code $CURL_EXIT)."
            exit 1
          fi

          echo "Status HTTP: $RESPOSTA"
          echo "Corpo da resposta:"
          cat /tmp/resposta.txt

          if [ "$RESPOSTA" != "200" ] && [ "$RESPOSTA" != "204" ]; then
            echo "Falha ao contatar o Supabase. Status retornado: $RESPOSTA"
            exit 1
          fi

          echo "Supabase acordado com sucesso."
