name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 12 * * 1,4'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Acorda o Supabase
        run: |
          set +e
          RESPOSTA=$(curl -s -o /tmp/resposta.txt -w "%{http_code}" \
            --ipv4 --retry 5 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/keep_alive" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json")
          CURL_EXIT=$?
          set -e

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "Falha de conexão com o Supabase (curl exit code $CURL_EXIT)."
            exit 1
          fi

          echo "Status HTTP: $RESPOSTA"
          echo "Corpo da resposta:"
          cat /tmp/resposta.txt

          if [ "$RESPOSTA" != "200" ] && [ "$RESPOSTA" != "204" ]; then
            echo "Falha ao contatar o Supabase. Status retornado: $RESPOSTA"
            exit 1
          fi

          echo "Supabase acordado com sucesso."
